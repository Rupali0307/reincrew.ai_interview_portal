<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReinCrew.ai – Candidate Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #070b19, #131e3a);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #3b82f6;
      text-decoration: none;
    }
    
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }
    
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .card {
      background: rgba(23, 37, 68, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    
    h2 {
      font-size: 2rem;
      margin-top: 0;
      color: #ffffff;
    }
    
    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
    }
    
    .instruction-list {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 20px 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    
    .instruction-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #cbd5e1;
    }
    
    .instruction-item:last-child {
      margin-bottom: 0;
    }
    
    .icon-check {
      color: #10b981;
      font-weight: bold;
    }
    
    .primary-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
    
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }
    
    .primary-btn:active {
      transform: translateY(0);
    }
    
    video {
      width: 100%;
      border-radius: 12px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    
    .recording-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ef4444;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    
    .status-msg {
      color: #cbd5e1;
      font-size: 1.1rem;
      margin-top: 15px;
    }
    
    .progress-bar-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 20px;
    }
    
    .progress-bar {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">ReinCrew.ai</a>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </nav>

  <div class="main-container" id="flowContainer">
    <!-- Rendered dynamically by candidate.js -->
    <div class="card">
      <h2>Loading Candidate Dashboard...</h2>
      <p class="subtitle">Checking session and camera permissions</p>
    </div>
  </div>

  <script type="module" src="./candidate.js"></script>
</body>
</html>
