<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReinCrew.ai – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #060b26, #111a36);
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #3b82f6;
      text-decoration: none;
    }
    
    .badge-admin {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #3b82f6;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .logout-btn:hover {
      background: #ef4444;
      color: white;
    }
    
    .dashboard-container {
      display: flex;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 30px;
      box-sizing: border-box;
      gap: 30px;
    }
    
    .sidebar {
      width: 260px;
      background: rgba(23, 37, 68, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: fit-content;
    }
    
    .sidebar-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .sidebar-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
    }
    
    .sidebar-btn.active {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      font-weight: 600;
    }
    
    .content-area {
      flex: 1;
      background: rgba(23, 37, 68, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 500px;
    }
    
    h2 {
      margin-top: 0;
      font-size: 1.8rem;
      color: white;
    }
    
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #3b82f6;
      margin: 10px 0;
    }
    
    .stat-label {
      color: #94a3b8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .action-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: #2563eb;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    th {
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    
    td {
      color: #cbd5e1;
    }
    
    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
    }
    
    .btn-icon {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: #111a36;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      box-sizing: border-box;
    }
    
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }
    
    .cancel-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo-container">
      <a href="#" class="logo">ReinCrew.ai</a>
      <span class="badge-admin">Admin Portal</span>
    </div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <button class="sidebar-btn active" data-tab="analytics">📊 System Analytics</button>
      <button class="sidebar-btn" data-tab="companies">🏢 Manage Companies</button>
      <button class="sidebar-btn" data-tab="recruiters">💼 Manage Recruiters</button>
      <button class="sidebar-btn" data-tab="candidates">👥 Manage Candidates</button>
      <button class="sidebar-btn" data-tab="interviews">🎥 Manage Interviews</button>
    </aside>

    <main class="content-area" id="contentArea">
      <!-- Loaded dynamically via admin.js -->
      <h2>Loading Admin Dashboard...</h2>
    </main>
  </div>

  <!-- CRUD Modal -->
  <div class="modal" id="crudModal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Item</h3>
      <form id="crudForm">
        <div id="dynamicFormFields"></div>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="closeModalBtn">Cancel</button>
          <button type="submit" class="action-btn" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
